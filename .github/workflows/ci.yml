name: CI

on:
  push:
    branches:
      - master
      - 3.0-develop
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.1', '7.2', '7.3', '7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none
      - run: find upload -name '*.php' -print0 | xargs -0 -n1 php -l

  quality:
    name: Style, compatibility, PHPStan and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, json
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: composer cs
      - run: composer compat
      - run: composer phpstan
      - run: composer test
