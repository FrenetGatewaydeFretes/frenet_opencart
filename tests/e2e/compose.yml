name: frenet-e2e

services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: opencart
      MARIADB_USER: opencart
      MARIADB_PASSWORD: opencart
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 5s
      retries: 60

  mock:
    image: php:8.2-cli
    command: php -S 0.0.0.0:8765 /mock/router.php
    environment:
      FRENET_MOCK_LOG: /log/requests.jsonl
      PHP_CLI_SERVER_WORKERS: 4
    volumes:
      - ../mock:/mock:ro
      - ./.work/log:/log

  api:
    image: nginx:1.27-alpine
    depends_on:
      - mock
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.work/tls:/tls:ro
    networks:
      default:
        aliases:
          - api.frenet.com.br

  web:
    build:
      context: docker
      args:
        PHP_VERSION: ${PHP_VERSION:-8.2}
    image: frenet-e2e-web:php${PHP_VERSION:-8.2}
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    ports:
      - "${E2E_PORT:-8080}:80"
    volumes:
      - ${OPENCART_ZIP:?OPENCART_ZIP is required}:/opencart.zip:ro
      - ./.work/tls/ca.pem:/usr/local/share/ca-certificates/frenet-e2e.crt:ro
